name: Bazel

on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]

  release:
    types:
      - published
      - prereleased

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        tls: [boringssl, openssl, 'no']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build project
        run: bazel build //... --@datastore-cpp-client//:tls=${{ matrix.tls }}

      - name: Run unit tests
        run: bazel test //ut:unit_tests --@datastore-cpp-client//:tls=${{ matrix.tls }} --test_output=errors

      # //ut:e2e_tests is tagged `manual`, so `bazel build //...` above
      # skips it; build it explicitly so the run step below doesn't pay
      # for compilation under the running-server timeout.
      - name: Build e2e tests
        if: runner.os != 'macOS'
        run: bazel build //ut:e2e_tests --@datastore-cpp-client//:tls=${{ matrix.tls }}

      # The e2e suite needs a live server on localhost:9000. The one way to get
      # one is ci/docker-compose.yml, so it runs where a container can:
      #   * Linux   — docker-compose directly
      #   * Windows — the same compose file under WSL2 + podman
      #   * macOS   — not available on hosted runners, so e2e is skipped there
      #               and only the hermetic //ut:unit_tests target runs.
      - name: Start Datastore (Linux, docker-compose)
        if: runner.os == 'Linux'
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ci/docker-compose.yml
          down-flags: --volumes

      - name: Enable WSL (Windows)
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages:
            podman
            podman-compose

      - name: Start Datastore (Windows, WSL + podman)
        if: runner.os == 'Windows'
        shell: wsl-bash {0}
        run: |
          cd $(wslpath -u "${{ github.workspace }}/ci/")
          podman-compose up -d
          timeout 60s bash -c \
            'until curl -s -o /dev/null -w "%{http_code}" http://localhost:8123 | grep -q "200"; do sleep 2; done'
          curl -s http://localhost:8123/?query=SELECT%20VERSION%28%29

      - name: Wait for Datastore (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8123/ > /dev/null; then
              echo "Datastore is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Datastore failed to start"
          exit 1

      # No container on hosted macOS runners, so no server to test against.
      - name: Run e2e tests
        if: runner.os != 'macOS'
        run: bazel test //ut:e2e_tests --@datastore-cpp-client//:tls=${{ matrix.tls }} --test_output=errors
