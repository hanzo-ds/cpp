name: macOS

on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]
  release:
    types:
      - published
      - prereleased

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        build: [nossl, ssl]
        include:
        - build: nossl

        - build: ssl
          SSL_CMAKE_OPTION: >-
            -D WITH_OPENSSL=ON
            -D OPENSSL_ROOT_DIR=/usr/local/opt/openssl/
          SSL_INSTALL: openssl

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Install dependencies
        run: brew install cmake ${{matrix.SSL_INSTALL}}

      - name: Print OpenSSL paths
        run: openssl version -d

      - name: Configure CMake
        run: |
          cmake \
            -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -D DS_MAP_BOOL_TO_UINT8=OFF \
            -D BUILD_TESTS=ON \
            ${{matrix.SSL_CMAKE_OPTION}} \
            -S ${{github.workspace}} \
            -B ${{github.workspace}}/build

      - name: Build
        run: |
          cmake \
            --build ${{github.workspace}}/build \
            --config ${{env.BUILD_TYPE}} \
            --target all

      # The one way to get a test server is ci/docker-compose.yml, which hosted
      # macOS runners cannot run. So macOS covers the build plus every test that
      # does not need a server (623 of them); the server-dependent suites run on
      # Linux and Windows, which can.
      - name: Test
        working-directory: ${{github.workspace}}/build/ut
        run: ./datastore-cpp-ut '--gtest_filter=-*RoundTrip*:*Client*:*Roundtrip*:*ArrayOfLowCardinality*:*LowCardinalityOfNullable*:*ColumnPerformanceTest*'
