services:
    datastore:
        image: 'ghcr.io/hanzoai/datastore:${DATASTORE_VERSION-26.2.3.2}'
        container_name: 'datastore-cpp-server'
        environment:
            DATASTORE_SKIP_USER_SETUP: 1
        ports:
            - '8123:8123'
            - '9000:9000'
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        # config.xml is layered in as a drop-in so the image keeps its own
        # config.d white-labelling (data paths, listen_host, nginx port proxy).
        volumes:
            - './docker-compose/config.xml:/etc/hanzo-datastore-server/config.d/ci.xml:z'
            - './docker-compose/users.xml:/etc/hanzo-datastore-server/users.xml:z'
        networks:
            - datastore

networks:
    datastore:
        driver: bridge
